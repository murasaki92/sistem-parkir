name: CI

on:
  push:
    branches:
      - main
      - feat/runnable-parkline
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARKLINE_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Smoke test
        run: |
          npm start -- -p 3100 > /tmp/parkline.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3100/login > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:3100/login > /dev/null; then
            cat /tmp/parkline.log
            exit 1
          fi
          BASE_URL=http://127.0.0.1:3100 npm run smoke
